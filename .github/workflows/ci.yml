name: CI

# Option 1: on every check-in / PR — inspect tests, run unit + system suites.
# On successful pushes to main, cut a GitHub Release (semver patch bump).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-tests:
    name: Inspect unit & system tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural test validity
        run: python scripts/inspect_tests.py

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: inspect-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q -m unit --junitxml=unit-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: unit-results.xml

  system-tests:
    name: System tests
    runs-on: ubuntu-latest
    needs: inspect-tests
    steps:
      - uses: actions/checkout@v4
      - name: Clone NMI library
        run: |
          git clone --depth 1 https://github.com/mrvr/NMI.git "$HOME/NMI"
          echo "NMI_ROOT=$HOME/NMI" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # NMI runtime deps used by system tests
          python -m pip install -r "$NMI_ROOT/requirements.txt"
      - name: Run system tests
        run: python -m pytest -q -m system --junitxml=system-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-results
          path: system-results.xml

  release:
    name: Release on green main
    runs-on: ubuntu-latest
    needs: [unit-tests, system-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bump patch version
        id: ver
        run: |
          VERSION="$(python scripts/next_version.py --bump patch --write)"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release candidate ${TAG}"
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION denguecad/__init__.py
          if git diff --cached --quiet; then
            echo "No version file changes"
          else
            git commit -m "chore(release): ${{ steps.ver.outputs.tag }} [skip ci]"
            git push
          fi
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "DengueCAD $TAG" \
            --generate-notes \
            --verify-tag
